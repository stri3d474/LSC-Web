[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsc-api"
version = "0.1.0"
description = "LSC backend API (FastAPI, Cloud Run). Accounts, billing, model distribution, community, messaging and call signaling."
requires-python = "==3.12.*"

# Exact pins only (steering: tech.md). No ranges.
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "structlog==24.1.0",
    "python-ulid==2.2.0",
    "PyJWT[crypto]==2.8.0",
    "cryptography==42.0.7",
    "firebase-admin==6.5.0",
    "google-cloud-firestore==2.16.0",
    "google-cloud-storage==2.16.0",
    "google-cloud-secret-manager==2.20.0",
    "google-cloud-pubsub==2.21.1",
    "google-api-python-client==2.130.0",
]

[project.optional-dependencies]
# Server-side split-model head (optional, CPU only).
head = [
    "onnxruntime==1.17.3",
]
# Speech-to-Text for live calls (P3).
speech = [
    "google-cloud-speech==2.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lsc_api" = ["py.typed"]
